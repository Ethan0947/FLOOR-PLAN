<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f4f4f4">
    <link rel="icon" type="image/png" href="icon.png"> <title>Ethan 格局神器 V2 (Mobile)</title>
    
    <style>
        :root {
            --primary-color: #6a7b76;
            --bg-color: #f4f4f4;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --border-color: #ddd;
        }
        body {
            font-family: -apple-system, "Microsoft JhengHei", sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            overflow: hidden; /* 禁止網頁捲動 */
            touch-action: none; /* 禁止手機縮放手勢 */
        }

        /* --- 手機版選單切換按鈕 --- */
        .menu-toggle {
            display: none; /* 電腦版隱藏 */
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 2000;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 1.5rem;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .menu-toggle:active { transform: scale(0.9); }

        /* 左側工具列 */
        .sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            overflow-y: auto;
            transition: transform 0.3s ease; /* 滑動動畫 */
            z-index: 1500;
        }

        /* 手機版 RWD 設定 */
        @media (max-width: 768px) {
            .menu-toggle { display: flex; } /* 顯示開關 */
            
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                width: 80%; /* 手機版寬度 */
                max-width: 300px;
                transform: translateX(-100%); /* 預設隱藏在左邊 */
                backdrop-filter: blur(10px);
            }
            .sidebar.active {
                transform: translateX(0); /* 滑出來 */
            }
            /* 遮罩層：選單打開時背景變暗 */
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.5);
                z-index: 1400;
            }
            .sidebar-overlay.active { display: block; }
        }

        .sidebar h3 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            font-size: 1.1rem;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        
        .tool-group { display: flex; flex-wrap: wrap; gap: 8px; }
        
        .tool-btn {
            padding: 10px 5px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            border-radius: 8px;
            flex: 1 1 30%; /* 一排三個 */
            text-align: center;
            font-size: 0.8rem;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .tool-btn:active { background-color: #f0f0f0; }
        .tool-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        /* 顏色球 */
        .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
        .color-swatch { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* 畫布 */
        .canvas-container {
            flex-grow: 1;
            position: relative;
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden;
            width: 100%; height: 100%;
        }

        /* 屬性面板 */
        .properties-panel {
            position: absolute;
            top: 20px; right: 20px;
            background: white; padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 220px;
            display: none;
            z-index: 1600;
        }
        @media (max-width: 768px) {
            .properties-panel {
                top: auto; bottom: 20px; right: 5%; width: 90%; /* 手機版改在下面 */
            }
        }

        /* 按鈕區 */
        .actions { margin-top: auto; display: flex; gap: 10px; padding-bottom: 20px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 5px; color: white; font-weight: bold; }
        .action-btn.delete { background: #e74c3c; }
        .action-btn.export { background: #27ae60; }
        
    </style>
    <script src="https://unpkg.com/fabric@5.3.0/dist/fabric.min.js"></script>
</head>
<body>

    <button class="menu-toggle" onclick="toggleSidebar()">🛠️</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div style="text-align: right; display: block; margin-bottom: 10px;">
            <span style="font-size: 0.8rem; color: #888;">Ethan 的格局畫板</span>
        </div>

        <div>
            <h3>🛠️ 基礎建設</h3>
            <div class="tool-group">
                <button class="tool-btn" onclick="setMode('select'); closeSidebar()" id="btn-select">✋ 移動</button>
                <button class="tool-btn" onclick="setMode('wall'); closeSidebar()" id="btn-wall">➖ 畫牆</button>
                <button class="tool-btn" onclick="addRoom(); closeSidebar()">⬜ 房間</button>
                <button class="tool-btn" onclick="addText(); closeSidebar()">📝 文字</button>
            </div>
        </div>

        <div>
            <h3>🚪 物件拖曳</h3>
            <div class="tool-group">
                <button class="tool-btn" onclick="addIcon('door'); closeSidebar()">🚪 門</button>
                <button class="tool-btn" onclick="addIcon('window'); closeSidebar()">🪟 窗</button>
                <button class="tool-btn" onclick="addIcon('balcony'); closeSidebar()">🧱 陽台</button>
                <button class="tool-btn" onclick="addIcon('compass'); closeSidebar()">🧭 北</button>
            </div>
        </div>

        <div>
            <h3>🎨 填色</h3>
            <div class="color-picker">
                <div class="color-swatch" style="background:#E6E6FA" onclick="changeBgColor('#E6E6FA')"></div>
                <div class="color-swatch" style="background:#F5DEB3" onclick="changeBgColor('#F5DEB3')"></div>
                <div class="color-swatch" style="background:#B0C4DE" onclick="changeBgColor('#B0C4DE')"></div>
                <div class="color-swatch" style="background:#F0FFF0" onclick="changeBgColor('#F0FFF0')"></div>
                <div class="color-swatch" style="background:transparent; border:1px solid #999;" onclick="changeBgColor('transparent')"></div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn delete" onclick="deleteObject()">刪除</button>
            <button class="action-btn export" onclick="exportImage()">存圖</button>
        </div>
        
        <div style="font-size:0.7rem; color:#aaa; text-align:center;">V2.0 Mobile Edition</div>
    </div>

    <div class="canvas-container" id="canvas-container">
        <canvas id="drawingCanvas"></canvas>
        
        <div class="properties-panel" id="prop-panel">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <strong>✏️ 編輯</strong>
                <span onclick="document.getElementById('prop-panel').style.display='none'" style="cursor:pointer">✖</span>
            </div>
            <div style="margin-bottom:10px;">
                <input type="text" id="obj-label" placeholder="修改文字..." oninput="updateLabel()" style="width:100%; padding:8px;">
            </div>
            <div>
                <label>旋轉:</label>
                <input type="range" id="obj-angle" min="0" max="360" oninput="updateAngle()" style="width:100%;">
            </div>
        </div>
    </div>

    <script>
        let canvas;
        let currentMode = 'select';
        let isDrawing = false;
        let line, isDown;

        // 手機版切換選單
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }
        
        // 選完工具後自動收起選單 (優化體驗)
        function closeSidebar() {
            if(window.innerWidth <= 768) {
                toggleSidebar();
            }
        }

        window.onload = function() {
            initCanvas();
        };

        function initCanvas() {
            // 畫布寬度自動扣除側邊欄 (電腦版) 或全螢幕 (手機版)
            let w = window.innerWidth;
            if(window.innerWidth > 768) w -= 280; // 電腦版扣掉 Sidebar

            canvas = new fabric.Canvas('drawingCanvas', {
                width: w,
                height: window.innerHeight,
                backgroundColor: 'rgba(0,0,0,0)',
                selection: true
            });

            // RWD: 螢幕轉向時自動調整
            window.addEventListener('resize', () => {
                let newW = window.innerWidth;
                if(window.innerWidth > 768) newW -= 280;
                canvas.setWidth(newW);
                canvas.setHeight(window.innerHeight);
                canvas.renderAll();
            });

            // 綁定事件
            canvas.on('mouse:down', onMouseDown);
            canvas.on('mouse:move', onMouseMove);
            canvas.on('mouse:up', onMouseUp);
            canvas.on('selection:created', updatePanel);
            canvas.on('selection:updated', updatePanel);
            canvas.on('selection:cleared', () => { document.getElementById('prop-panel').style.display = 'none'; });
        }

        // --- 核心繪圖邏輯 (沿用你的版本) ---
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + mode)?.classList.add('active');
            
            if (mode === 'wall') {
                canvas.selection = false;
                canvas.defaultCursor = 'crosshair';
            } else {
                canvas.selection = true;
                canvas.defaultCursor = 'default';
            }
        }

        function onMouseDown(o) {
            if(currentMode !== 'wall') return;
            isDown = true;
            let pointer = canvas.getPointer(o.e);
            let points = [ pointer.x, pointer.y, pointer.x, pointer.y ];
            line = new fabric.Line(points, { strokeWidth: 5, fill: 'black', stroke: 'black', originX: 'center', originY: 'center', selectable: false, evented: false });
            canvas.add(line);
        }

        function onMouseMove(o) {
            if (!isDrawing && !isDown) return;
            if(currentMode !== 'wall') return;
            let pointer = canvas.getPointer(o.e);
            line.set({ x2: pointer.x, y2: pointer.y });
            canvas.renderAll();
        }

        function onMouseUp(o) {
            if(currentMode !== 'wall') return;
            isDown = false;
            line.setCoords();
            line.selectable = true;
            line.evented = true; // 畫完後變成可選取
        }

        // --- 物件新增邏輯 (簡化版) ---
        function addRoom() {
            const rect = new fabric.Rect({ left: 100, top: 100, fill: 'transparent', stroke: 'black', strokeWidth: 5, width: 150, height: 150 });
            canvas.add(rect); canvas.setActiveObject(rect);
        }
        function addText() {
            const text = new fabric.IText('點兩下編輯', { left: 150, top: 150, fontSize: 20, fill: '#333' });
            canvas.add(text); canvas.setActiveObject(text);
        }
        function addIcon(type) {
            let obj;
            let center = canvas.getCenter();
            // 在手機上不要完全置中，稍微偏上以免被手指擋住
            let topPos = center.top;
            let leftPos = center.left;

            if(type==='door') {
                const f = new fabric.Rect({width:50, height:5, fill:'white', stroke:'black', strokeWidth:2});
                const l = new fabric.Rect({width:50, height:5, fill:'#666', top:5, angle:45});
                obj = new fabric.Group([f,l], {left:leftPos, top:topPos});
            } else if(type==='window') {
                const f = new fabric.Rect({width:80, height:10, fill:'white', stroke:'black', strokeWidth:2});
                const g = new fabric.Rect({width:76, height:4, fill:'lightblue', left:2, top:3});
                obj = new fabric.Group([f,g], {left:leftPos, top:topPos});
            } else if(type==='compass') {
                // 簡易指北針
                const c = new fabric.Circle({radius:20, fill:'', stroke:'black', strokeWidth:2});
                const n = new fabric.Triangle({width:10, height:20, fill:'red', left:15, top:0});
                obj = new fabric.Group([c,n], {left:leftPos, top:topPos});
            } else {
                 // 陽台等其他
                 const r = new fabric.Rect({width:80, height:30, fill:'#eee', stroke:'#888', strokeWidth:2});
                 obj = r;
            }
            if(obj) { canvas.add(obj); canvas.setActiveObject(obj); }
        }

        // --- 屬性更新 ---
        function updatePanel() {
            const activeObj = canvas.getActiveObject();
            if (!activeObj) return;
            document.getElementById('prop-panel').style.display = 'block';
            document.getElementById('obj-angle').value = activeObj.angle;
            if(activeObj.type === 'i-text') document.getElementById('obj-label').value = activeObj.text;
        }
        function updateLabel() {
            const activeObj = canvas.getActiveObject();
            if(activeObj && activeObj.type === 'i-text') {
                activeObj.set('text', document.getElementById('obj-label').value);
                canvas.renderAll();
            }
        }
        function updateAngle() {
            const activeObj = canvas.getActiveObject();
            if(activeObj) {
                activeObj.set('angle', parseInt(document.getElementById('obj-angle').value));
                canvas.renderAll();
            }
        }
        function changeBgColor(c) {
            const activeObj = canvas.getActiveObject();
            if(activeObj) {
                if(activeObj.type==='group') activeObj.item(0).set('fill', c);
                else activeObj.set('fill', c);
                canvas.renderAll();
            }
        }
        function deleteObject() {
            const activeObj = canvas.getActiveObject();
            if(activeObj) canvas.remove(activeObj);
            document.getElementById('prop-panel').style.display = 'none';
        }
        function exportImage() {
            canvas.discardActiveObject();
            canvas.renderAll();
            const link = document.createElement('a');
            link.download = 'floor_plan.png';
            link.href = canvas.toDataURL({format:'png', multiplier:2});
            link.click();
        }
    </script>
</body>
</html>
