<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>Ethan 格局神器 V3</title>
<script src="https://unpkg.com/fabric@5.3.0/dist/fabric.min.js"></script>
<style>
:root {
  --bg: #1a1a2e; --sidebar: #16213e; --panel: #0f3460;
  --accent: #e94560; --accent2: #f5a623; --text: #eaeaea;
  --muted: #8892a4; --border: #2a2a4a; --btn: #1e2a45;
  --btn-hover: #2a3a5a; --green: #2ecc71; --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft JhengHei", -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; touch-action: none; }

.sidebar { width: 270px; min-width: 270px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; z-index: 1500; transition: transform 0.3s ease; }
.sidebar-header { padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 1.2rem; font-weight: 900; color: var(--accent); letter-spacing: -1px; }
.version { font-size: 0.7rem; background: var(--accent); color: white; padding: 2px 8px; border-radius: 20px; font-weight: bold; }
.section { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.section-title { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; font-weight: 700; }
.tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.tool-btn { background: var(--btn); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); cursor: pointer; padding: 7px 4px; text-align: center; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all 0.15s; line-height: 1.2; }
.tool-btn:hover { background: var(--btn-hover); border-color: var(--accent); }
.tool-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
.tool-btn .icon { font-size: 1.1rem; }
.color-row { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s; }
.swatch:hover { transform: scale(1.15); border-color: white; }
.swatch.active { border-color: var(--accent2); transform: scale(1.15); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
.toggle-label { font-size: 0.78rem; }
.toggle { position: relative; width: 34px; height: 18px; background: var(--border); border-radius: 20px; cursor: pointer; transition: background 0.2s; }
.toggle.on { background: var(--green); }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: white; border-radius: 50%; transition: left 0.2s; }
.toggle.on::after { left: 18px; }
.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 12px; }
.act-btn { padding: 9px; border: none; border-radius: var(--radius); font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 4px; }
.act-btn:hover { opacity: 0.85; }
.act-btn.undo { background: var(--btn); color: var(--text); border: 1px solid var(--border); }
.act-btn.redo { background: var(--btn); color: var(--text); border: 1px solid var(--border); }
.act-btn.clear { background: #3a1a2a; color: var(--accent); border: 1px solid var(--accent); }
.act-btn.export { background: var(--green); color: white; }

.canvas-wrap { flex: 1; position: relative; background: #f5f0e8; background-image: linear-gradient(rgba(100,100,200,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(100,100,200,0.08) 1px, transparent 1px); background-size: 20px 20px; overflow: hidden; }
#mainCanvas { display: block; }

/* 點對點畫牆預覽點 */
.wall-cursor { position: absolute; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; pointer-events: none; transform: translate(-50%,-50%); display: none; z-index: 100; box-shadow: 0 0 0 3px rgba(233,69,96,0.3); }
.wall-start-dot { position: absolute; width: 10px; height: 10px; background: var(--accent2); border-radius: 50%; pointer-events: none; transform: translate(-50%,-50%); z-index: 101; display: none; box-shadow: 0 0 0 4px rgba(245,166,35,0.3); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 4px rgba(245,166,35,0.3)} 50%{box-shadow:0 0 0 8px rgba(245,166,35,0.1)} }

.statusbar { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(22,33,62,0.92); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 0.72rem; color: var(--muted); backdrop-filter: blur(8px); pointer-events: none; white-space: nowrap; }
.statusbar span { color: var(--accent2); font-weight: bold; }
.hint-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(233,69,96,0.9); border-radius: 20px; padding: 5px 14px; font-size: 0.75rem; color: white; pointer-events: none; display: none; white-space: nowrap; }

.prop-panel { position: absolute; top: 16px; right: 16px; background: var(--sidebar); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; width: 200px; display: none; z-index: 1600; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
.prop-panel h4 { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: flex; justify-content: space-between; }
.prop-panel h4 .close-btn { cursor: pointer; color: var(--accent); font-size: 1rem; }
.prop-row { margin-bottom: 9px; }
.prop-row label { font-size: 0.72rem; color: var(--muted); display: block; margin-bottom: 3px; }
.prop-row input[type=text] { width: 100%; padding: 6px 8px; background: var(--btn); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.78rem; }
.prop-row input[type=range] { width: 100%; accent-color: var(--accent); }
.prop-row .angle-val { font-size: 0.72rem; color: var(--accent2); text-align: right; }
.line-style-row { display: flex; gap: 6px; }
.line-btn { flex: 1; padding: 6px; background: var(--btn); border: 1px solid var(--border); border-radius: 6px; color: var(--text); cursor: pointer; font-size: 0.72rem; text-align: center; }
.line-btn.active { background: var(--accent); border-color: var(--accent); }

.menu-toggle { display: none; position: fixed; top: 12px; left: 12px; z-index: 2000; background: var(--accent); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 1.1rem; cursor: pointer; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(233,69,96,0.4); }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1400; }
@media (max-width: 768px) {
  .menu-toggle { display: flex; }
  .sidebar { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .overlay.open { display: block; }
  .prop-panel { top: auto; bottom: 16px; right: 8px; left: 8px; width: auto; }
}
</style>
</head>
<body>
<button class="menu-toggle" onclick="toggleSidebar()">🛠️</button>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div><div class="logo">格局神器</div><div style="font-size:0.65rem;color:var(--muted);margin-top:1px;">Ethan Floor Plan Tool</div></div>
    <span class="version">V3</span>
  </div>

  <div class="section">
    <div class="section-title">✏️ 繪圖模式</div>
    <div class="tool-grid">
      <button class="tool-btn active" id="btn-select" onclick="setMode('select')"><span class="icon">✋</span>選取</button>
      <button class="tool-btn" id="btn-wall" onclick="setMode('wall')"><span class="icon">➖</span>實線牆</button>
      <button class="tool-btn" id="btn-dash" onclick="setMode('dash')"><span class="icon">┄</span>虛線</button>
      <button class="tool-btn" onclick="addRoom()"><span class="icon">⬜</span>房間</button>
      <button class="tool-btn" onclick="addText()"><span class="icon">📝</span>文字</button>
      <button class="tool-btn" onclick="addDimension()"><span class="icon">📏</span>標尺</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🚪 門窗陽台</div>
    <div class="tool-grid">
      <button class="tool-btn" onclick="addObj('door')"><span class="icon">🚪</span>推門</button>
      <button class="tool-btn" onclick="addObj('door-slide')"><span class="icon">↔️</span>拉門</button>
      <button class="tool-btn" onclick="addObj('window')"><span class="icon">🪟</span>窗</button>
      <button class="tool-btn" onclick="addObj('balcony')"><span class="icon">🏗️</span>陽台</button>
      <button class="tool-btn" onclick="addObj('pillar')"><span class="icon">⬛</span>柱子</button>
      <button class="tool-btn" onclick="addObj('compass')"><span class="icon">🧭</span>指北</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🪜 樓梯</div>
    <div class="tool-grid">
      <button class="tool-btn" onclick="addObj('stair-straight')"><span class="icon">🪜</span>直梯</button>
      <button class="tool-btn" onclick="addObj('stair-spiral')"><span class="icon">🌀</span>旋轉梯</button>
      <button class="tool-btn" onclick="addObj('stair-l')"><span class="icon">↩️</span>L型梯</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🚿 衛浴設備</div>
    <div class="tool-grid">
      <button class="tool-btn" onclick="addObj('toilet')"><span class="icon">🚽</span>馬桶</button>
      <button class="tool-btn" onclick="addObj('bathtub')"><span class="icon">🛁</span>浴缸</button>
      <button class="tool-btn" onclick="addObj('sink')"><span class="icon">🪥</span>洗手台</button>
      <button class="tool-btn" onclick="addObj('shower')"><span class="icon">🚿</span>淋浴</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🍳 廚房設備</div>
    <div class="tool-grid">
      <button class="tool-btn" onclick="addObj('stove')"><span class="icon">🔥</span>瓦斯爐</button>
      <button class="tool-btn" onclick="addObj('counter')"><span class="icon">📦</span>流理台</button>
      <button class="tool-btn" onclick="addObj('fridge')"><span class="icon">🧊</span>冰箱</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🛋️ 家具</div>
    <div class="tool-grid">
      <button class="tool-btn" onclick="addObj('bed-single')"><span class="icon">🛏️</span>單床</button>
      <button class="tool-btn" onclick="addObj('bed-double')"><span class="icon">🛏️</span>雙床</button>
      <button class="tool-btn" onclick="addObj('sofa')"><span class="icon">🛋️</span>沙發</button>
      <button class="tool-btn" onclick="addObj('table')"><span class="icon">🪑</span>餐桌</button>
      <button class="tool-btn" onclick="addObj('desk')"><span class="icon">🖥️</span>書桌</button>
      <button class="tool-btn" onclick="addObj('wardrobe')"><span class="icon">🗄️</span>衣櫃</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🎨 填色</div>
    <div class="color-row">
      <div class="swatch active" style="background:#FAFAFA" data-color="#FAFAFA" onclick="applyColor(this)"></div>
      <div class="swatch" style="background:#E6E6FA" data-color="#E6E6FA" onclick="applyColor(this)"></div>
      <div class="swatch" style="background:#F5DEB3" data-color="#F5DEB3" onclick="applyColor(this)"></div>
      <div class="swatch" style="background:#B0C4DE" data-color="#B0C4DE" onclick="applyColor(this)"></div>
      <div class="swatch" style="background:#F0FFF0" data-color="#F0FFF0" onclick="applyColor(this)"></div>
      <div class="swatch" style="background:#FFE4E1" data-color="#FFE4E1" onclick="applyColor(this)"></div>
      <div class="swatch" style="background:#FFF8DC" data-color="#FFF8DC" onclick="applyColor(this)"></div>
      <div class="swatch" style="background:transparent;border:1px solid #888" data-color="transparent" onclick="applyColor(this)"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">⚙️ 設定</div>
    <div class="toggle-row">
      <span class="toggle-label">格線吸附</span>
      <div class="toggle on" id="snapToggle" onclick="toggleSnap()"></div>
    </div>
    <div class="toggle-row" style="margin-top:6px">
      <span class="toggle-label">顯示格線</span>
      <div class="toggle on" id="gridToggle" onclick="toggleGrid()"></div>
    </div>
  </div>

  <div class="action-row">
    <button class="act-btn undo" onclick="undo()">↩️ 復原</button>
    <button class="act-btn redo" onclick="redo()">↪️ 重做</button>
    <button class="act-btn clear" onclick="clearAll()">🗑️ 清空</button>
    <button class="act-btn export" onclick="exportImg()">💾 存圖</button>
  </div>
  <div style="padding:0 12px 12px;font-size:0.65rem;color:var(--muted);text-align:center;">Ctrl+Z 復原 · Del 刪除 · Esc 取消</div>
</div>

<div class="canvas-wrap" id="canvasWrap">
  <canvas id="mainCanvas"></canvas>
  <div class="wall-cursor" id="wallCursor"></div>
  <div class="wall-start-dot" id="wallStartDot"></div>
  <div class="hint-bar" id="hintBar"></div>
  <div class="statusbar">模式：<span id="modeLabel">選取</span> ｜ 物件：<span id="objCount">0</span></div>
</div>

<div class="prop-panel" id="propPanel">
  <h4>物件屬性 <span class="close-btn" onclick="closeProp()">✕</span></h4>
  <div class="prop-row">
    <label>文字標籤</label>
    <input type="text" id="propLabel" placeholder="輸入標籤..." oninput="updateLabel()">
  </div>
  <div class="prop-row">
    <label>旋轉角度 <span class="angle-val" id="angleVal">0°</span></label>
    <input type="range" id="propAngle" min="0" max="360" value="0" oninput="updateAngle()">
  </div>
  <div class="prop-row">
    <label>線條樣式</label>
    <div class="line-style-row">
      <button class="line-btn active" id="lineSolid" onclick="setLineStyle('solid')">實線</button>
      <button class="line-btn" id="lineDash" onclick="setLineStyle('dash')">虛線</button>
    </div>
  </div>
  <div class="prop-row">
    <label>線條顏色</label>
    <input type="color" id="propStroke" value="#1a1a2e" oninput="updateStroke()" style="width:100%;height:26px;border:none;cursor:pointer;background:none;">
  </div>
</div>

<script>
// ══════════════════════════════════════════
// 狀態
// ══════════════════════════════════════════
let canvas, mode = 'select';
let snapOn = true, gridOn = true;
let history = [], histIdx = -1;
let suppressHist = false;
const GRID = 20;

// 點對點畫牆
let wallMode_started = false;
let wallStartX = 0, wallStartY = 0;
let wallPreviewLine = null;

// ══════════════════════════════════════════
// 初始化
// ══════════════════════════════════════════
window.onload = () => {
  const wrap = document.getElementById('canvasWrap');
  canvas = new fabric.Canvas('mainCanvas', {
    width: wrap.clientWidth, height: wrap.clientHeight,
    backgroundColor: 'rgba(0,0,0,0)',
    selection: true,
    preserveObjectStacking: true,
  });

  // 牆壁/虛線用 canvas 原生事件（點對點）
  canvas.upperCanvasEl.addEventListener('mousemove', onWallMouseMove);
  canvas.upperCanvasEl.addEventListener('click', onWallClick);

  canvas.on('selection:created', showProp);
  canvas.on('selection:updated', showProp);
  canvas.on('selection:cleared', () => { document.getElementById('propPanel').style.display = 'none'; });
  canvas.on('object:modified', saveHistory);
  canvas.on('object:added', () => { if (!suppressHist) saveHistory(); updateStatus(); });
  canvas.on('object:removed', updateStatus);

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if ((e.ctrlKey||e.metaKey) && e.key==='z') { e.preventDefault(); undo(); }
    if ((e.ctrlKey||e.metaKey) && e.key==='y') { e.preventDefault(); redo(); }
    if (e.key==='Delete'||e.key==='Backspace') deleteSelected();
    if (e.key==='Escape') cancelWall();
  });

  window.addEventListener('resize', () => {
    canvas.setWidth(wrap.clientWidth);
    canvas.setHeight(wrap.clientHeight);
    canvas.renderAll();
  });

  saveHistory();
  updateStatus();
};

// ══════════════════════════════════════════
// Snap
// ══════════════════════════════════════════
function snap(v) { return snapOn ? Math.round(v/GRID)*GRID : v; }
function getPointerFromEvent(e) {
  const rect = canvas.upperCanvasEl.getBoundingClientRect();
  return { x: snap(e.clientX - rect.left), y: snap(e.clientY - rect.top) };
}

// ══════════════════════════════════════════
// 點對點畫牆（修正1,2,3）
// ══════════════════════════════════════════
function onWallMouseMove(e) {
  if (mode !== 'wall' && mode !== 'dash') return;
  const p = getPointerFromEvent(e);
  const cursor = document.getElementById('wallCursor');
  cursor.style.left = p.x + 'px';
  cursor.style.top = p.y + 'px';
  cursor.style.display = 'block';

  if (wallMode_started && wallPreviewLine) {
    wallPreviewLine.set({ x2: p.x, y2: p.y });
    canvas.renderAll();
  }
}

function onWallClick(e) {
  if (mode !== 'wall' && mode !== 'dash') return;
  // 如果點到了已有物件，不要觸發畫牆（修正3）
  const target = canvas.findTarget(e);
  if (target && !wallMode_started) return;

  const p = getPointerFromEvent(e);

  if (!wallMode_started) {
    // 第一點：設起點
    wallMode_started = true;
    wallStartX = p.x; wallStartY = p.y;
    const dot = document.getElementById('wallStartDot');
    dot.style.left = p.x + 'px'; dot.style.top = p.y + 'px';
    dot.style.display = 'block';
    showHint('點擊第二個位置完成牆壁，Esc 取消');

    const isDash = (mode === 'dash');
    wallPreviewLine = new fabric.Line([p.x, p.y, p.x, p.y], {
      stroke: isDash ? '#888' : '#1a1a2e',
      strokeWidth: isDash ? 3 : 6,
      strokeDashArray: isDash ? [8, 6] : [],
      selectable: false, evented: false,
      originX: 'center', originY: 'center',
      opacity: 0.5
    });
    suppressHist = true;
    canvas.add(wallPreviewLine);
    suppressHist = false;
  } else {
    // 第二點：完成
    const isDash = (mode === 'dash');
    if (wallPreviewLine) canvas.remove(wallPreviewLine);
    const line = new fabric.Line([wallStartX, wallStartY, p.x, p.y], {
      stroke: isDash ? '#888' : '#1a1a2e',
      strokeWidth: isDash ? 3 : 6,
      strokeDashArray: isDash ? [8, 6] : [],
      selectable: true, evented: true,
      originX: 'center', originY: 'center',
      opacity: 1
    });
    canvas.add(line);
    canvas.setActiveObject(line);
    resetWallState();
    showHint('');
    saveHistory();
  }
}

function cancelWall() {
  if (wallPreviewLine) canvas.remove(wallPreviewLine);
  resetWallState();
  showHint('');
  canvas.renderAll();
}

function resetWallState() {
  wallMode_started = false;
  wallPreviewLine = null;
  document.getElementById('wallStartDot').style.display = 'none';
}

function showHint(msg) {
  const h = document.getElementById('hintBar');
  if (msg) { h.textContent = msg; h.style.display = 'block'; }
  else { h.style.display = 'none'; }
}

// ══════════════════════════════════════════
// 模式切換
// ══════════════════════════════════════════
function setMode(m) {
  cancelWall();
  mode = m;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + m);
  if (btn) btn.classList.add('active');
  // 畫牆/虛線模式：停用 fabric 選取，讓點擊穿透到 upperCanvas
  canvas.selection = (m === 'select');
  canvas.defaultCursor = (m === 'select') ? 'default' : 'crosshair';
  // 隱藏滑鼠點
  if (m === 'select') {
    document.getElementById('wallCursor').style.display = 'none';
  }
  const labels = { select:'選取', wall:'畫實線牆', dash:'畫虛線' };
  document.getElementById('modeLabel').textContent = labels[m] || m;
  if (m !== 'select') showHint('點擊第一個位置設定起點');
  else showHint('');
  if (window.innerWidth <= 768) closeSidebar();
}

// ══════════════════════════════════════════
// 基礎物件
// ══════════════════════════════════════════
function cx() { return canvas.getWidth()/2; }
function cy() { return canvas.getHeight()/2; }
function addRoom() {
  const r = new fabric.Rect({ left:snap(cx()-75), top:snap(cy()-75), width:150, height:150, fill:'#FAFAFA', stroke:'#1a1a2e', strokeWidth:4 });
  canvas.add(r); canvas.setActiveObject(r);
  if (window.innerWidth<=768) closeSidebar();
}
function addText() {
  const t = new fabric.IText('房間名稱', { left:snap(cx()-40), top:snap(cy()-12), fontSize:18, fill:'#333', fontFamily:'Microsoft JhengHei' });
  canvas.add(t); canvas.setActiveObject(t);
  if (window.innerWidth<=768) closeSidebar();
}
function addDimension() {
  const grp = new fabric.Group([
    new fabric.Line([0,0,100,0], { stroke:'#e94560', strokeWidth:2 }),
    new fabric.Line([0,-6,0,6], { stroke:'#e94560', strokeWidth:2 }),
    new fabric.Line([100,-6,100,6], { stroke:'#e94560', strokeWidth:2 }),

  canvas.add(grp); canvas.setActiveObject(grp);
  if (window.innerWidth<=768) closeSidebar();
}

function addObj(type) {
  const fn = OBJS[type];
  if (!fn) return;
  canvas.add(fn());
  canvas.setActiveObject(canvas.item(canvas.size()-1));
  if (window.innerWidth<=768) closeSidebar();
}

// ══════════════════════════════════════════
// 填色
// ══════════════════════════════════════════
function applyColor(el) {
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  const color = el.dataset.color;
  const obj = canvas.getActiveObject();
  if (!obj) return;
  if (obj.type==='group') obj.item(0).set('fill', color);
  else obj.set('fill', color);
  canvas.renderAll(); saveHistory();
}

// ══════════════════════════════════════════
// 屬性面板
// ══════════════════════════════════════════
function showProp() {
  const obj = canvas.getActiveObject();
  if (!obj) return;
  document.getElementById('propPanel').style.display = 'block';
  const angle = Math.round(obj.angle||0);
  document.getElementById('propAngle').value = angle;
  document.getElementById('angleVal').textContent = angle + '°';
  if (obj.type==='i-text') document.getElementById('propLabel').value = obj.text;
  else document.getElementById('propLabel').value = obj.name||'';
  const isDash = obj.strokeDashArray && obj.strokeDashArray.length > 0;
  document.getElementById('lineSolid').className = 'line-btn' + (isDash?'':' active');
  document.getElementById('lineDash').className = 'line-btn' + (isDash?' active':'');
}
function closeProp() { document.getElementById('propPanel').style.display='none'; }
function updateLabel() {
  const obj = canvas.getActiveObject(); if (!obj) return;
  if (obj.type==='i-text') { obj.set('text', document.getElementById('propLabel').value); canvas.renderAll(); }
}
function updateAngle() {
  const obj = canvas.getActiveObject(); if (!obj) return;
  const v = parseInt(document.getElementById('propAngle').value);
  document.getElementById('angleVal').textContent = v+'°';
  obj.set('angle', v); canvas.renderAll();
}
function updateStroke() {
  const obj = canvas.getActiveObject(); if (!obj) return;
  obj.set('stroke', document.getElementById('propStroke').value);
  canvas.renderAll(); saveHistory();
}
function setLineStyle(style) {
  const obj = canvas.getActiveObject(); if (!obj) return;
  obj.set('strokeDashArray', style==='dash' ? [8,6] : []);
  canvas.renderAll(); saveHistory();
  document.getElementById('lineSolid').className = 'line-btn' + (style==='solid'?' active':'');
  document.getElementById('lineDash').className = 'line-btn' + (style==='dash'?' active':'');
}

// ══════════════════════════════════════════
// 刪除 / 清空
// ══════════════════════════════════════════
function deleteSelected() {
  const obj = canvas.getActiveObject(); if (!obj) return;
  canvas.remove(obj); saveHistory();
  document.getElementById('propPanel').style.display='none';
}
function clearAll() {
  if (!confirm('確定清空畫布？')) return;
  canvas.clear(); canvas.backgroundColor='rgba(0,0,0,0)'; canvas.renderAll(); saveHistory();
}

// ══════════════════════════════════════════
// Snap & Grid
// ══════════════════════════════════════════
function toggleSnap() { snapOn=!snapOn; document.getElementById('snapToggle').className='toggle'+(snapOn?' on':''); }
function toggleGrid() {
  gridOn=!gridOn; document.getElementById('gridToggle').className='toggle'+(gridOn?' on':'');
  document.getElementById('canvasWrap').style.backgroundImage = gridOn
    ? 'linear-gradient(rgba(100,100,200,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(100,100,200,0.08) 1px, transparent 1px)' : 'none';
}

// ══════════════════════════════════════════
// Undo / Redo
// ══════════════════════════════════════════
function saveHistory() {
  const json = JSON.stringify(canvas.toJSON());
  history = history.slice(0, histIdx+1);
  history.push(json); histIdx = history.length-1; updateStatus();
}
function undo() { if (histIdx<=0) return; histIdx--; loadState(history[histIdx]); }
function redo() { if (histIdx>=history.length-1) return; histIdx++; loadState(history[histIdx]); }
function loadState(json) {
  suppressHist = true;
  canvas.loadFromJSON(json, () => { canvas.renderAll(); suppressHist=false; updateStatus(); });
}

// ══════════════════════════════════════════
// 狀態列 / 匯出
// ══════════════════════════════════════════
function updateStatus() { document.getElementById('objCount').textContent = canvas.getObjects().length; }
function exportImg() {
  canvas.discardActiveObject(); canvas.renderAll();
  const link = document.createElement('a');
  link.download = 'floor_plan_' + Date.now() + '.png';
  link.href = canvas.toDataURL({ format:'png', multiplier:2 });
  link.click();
}

// ══════════════════════════════════════════
// Mobile
// ══════════════════════════════════════════
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }
</script>
